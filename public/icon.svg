<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base for standalone & maskable safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern representing smart home connectivity -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="96" y1="416" x2="416" y2="416" />
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Main Shield Body -->
  <g filter="url(#dropShadow)">
    <path 
      d="M256 76 
         C330 76 392 98 404 150 
         C404 286 338 386 256 436 
         C174 386 108 286 108 150 
         C120 98 182 76 256 76 Z" 
      fill="url(#shieldGrad)" 
    />
    
    <!-- Shield Top Highlight / Glow -->
    <path 
      d="M256 86 
         C320 86 376 105 388 150 
         C388 220 360 290 320 340 
         C280 280 260 180 256 86 Z" 
      fill="url(#glowGrad)" 
    />

    <!-- Inner Shield Inset -->
    <path 
      d="M256 104 
         C316 104 366 122 376 164 
         C376 274 322 358 256 400 
         C190 358 136 274 136 164 
         C146 122 196 104 256 104 Z" 
      fill="#0f172a" 
      opacity="0.88"
    />

    <!-- Smart Home Node Connection Lines -->
    <g stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
      <line x1="256" y1="130" x2="256" y2="175" />
      <line x1="180" y1="210" x2="220" y2="230" />
      <line x1="332" y1="210" x2="292" y2="230" />
      <line x1="256" y1="315" x2="256" y2="365" />
    </g>

    <!-- Connection Nodes (Circles) -->
    <circle cx="256" cy="130" r="6" fill="#38bdf8" />
    <circle cx="180" cy="210" r="6" fill="#38bdf8" />
    <circle cx="332" cy="210" r="6" fill="#38bdf8" />
    <circle cx="256" cy="365" r="6" fill="#38bdf8" />

    <!-- Central Security Checkmark & Smart Hub Emblem -->
    <path 
      d="M204 252 
         L240 288 
         L316 208" 
      fill="none" 
      stroke="url(#accentGrad)" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      filter="url(#glow)"
    />
  </g>

  <!-- Bottom HanssonHub Brand Text Accent -->
  <text 
    x="256" 
    y="472" 
    text-anchor="middle" 
    fill="#94a3b8" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="24" 
    font-weight="800" 
    letter-spacing="5"
    opacity="0.9"
  >HANSSONHUB</text>
</svg>
